version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    # Celowo NIE dajemy sekcji "ports: - 5432:5432" żeby zablokować dostęp z zewnątrz
    networks:
      - db_network

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db
    networks:
      - db_network
      - pgadmin_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - pgadmin_network

# Definicja dwóch osobnych sieci zgodnie z poleceniem
networks:
  db_network:
    driver: bridge # Sieć tylko dla Django i PostgreSQL
  pgadmin_network:
    driver: bridge # Sieć tylko dla Django i pgAdmina
